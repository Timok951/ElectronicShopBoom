{% extends "index.html" %}
{% block content %}

<section class="top">
    <div class="wrapper">
        <div class="form-card">
            <header class="top__intro">
                <p class="top__subtitle">Account access</p>
                <h2 class="top__title section__title">Login</h2>
                <p class="top__description">Sign in with your username or email to continue.</p>
            </header>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="top_card-button">Login</button>
            </form>
            <p class="top__description">
                Don't have an account yet? <a href="{% url 'registration_page' %}">Create one</a>.
            </p>
        </div>
    </div>
</section>

{% endblock %}
